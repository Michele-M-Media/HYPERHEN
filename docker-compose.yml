services:
  hyperhen-build:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./.docker/pacbrew-ps5:/opt/ps5-payload-sdk/target/user/homebrew:ro
    command: >
      /bin/bash -lc "set -euo pipefail; rm -rf /tmp/hyperhen-build; cp -a /workspace/. /tmp/hyperhen-build; python3 -c \"from pathlib import Path; files=list(Path('/tmp/hyperhen-build').rglob('*.sh'))+list(Path('/tmp/hyperhen-build').rglob('*.bash')); [p.write_bytes(p.read_bytes().replace(bytes([13]), bytes())) for p in files]\"; cd /tmp/hyperhen-build; ./scripts/sync_dependencies.sh; export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk; export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config; export PATH=/usr/lib/llvm-18/bin:$${PS5_PAYLOAD_SDK}/bin:$${PATH}; ./scripts/build.sh --jobs 8; rm -rf /workspace/build; cp -a /tmp/hyperhen-build/build /workspace/build"
    environment:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      BUILD_TYPE: Debug
      JOBS: "8"
      KEYSTONE_PREFIX: /usr/local
      LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/llvm-18/bin:/opt/ps5-payload-sdk/bin
    stdin_open: true
    tty: true

  hyperhen-tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      /bin/bash -lc "set -euo pipefail; ./scripts/sync_dependencies.sh; make -C source/util/tests clean; make -C source/util/tests test"
    environment:
      KEYSTONE_PREFIX: /usr/local
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/llvm-18/bin:/opt/ps5-payload-sdk/bin
    stdin_open: true
    tty: true
