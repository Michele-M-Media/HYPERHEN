name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the request, not an implementation plan.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Toolbox
        - Cheats
        - Monitor bar
        - Fan control
        - Payloads
        - Rest Mode
        - Language
        - Other
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What do you want
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve, or what is missing today.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: How it should look or behave if this shipped.
    validations:
      required: true
