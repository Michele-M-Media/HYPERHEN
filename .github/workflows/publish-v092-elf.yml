name: Publish HyperHEN v0.9.2 ELF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v092-elf.yml

concurrency:
  group: publish-hyperhen-v0.9.2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PS5_PAYLOAD_SDK: ${{ github.workspace }}/.ps5-payload-sdk
      LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
    steps:
      - name: Check out HyperHEN
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang-18 \
            cmake \
            curl \
            file \
            git \
            libssl-dev \
            librsvg2-bin \
            lld-18 \
            llvm-18 \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-pyelftools \
            ripgrep \
            unzip \
            wget \
            xz-utils \
            yasm
          sudo ln -sf /usr/lib/llvm-18/bin/llvm-config /usr/local/bin/llvm-config

      - name: Resolve PS5 Payload SDK release
        id: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ps5-payload-dev/sdk/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Cache PS5 Payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PS5_PAYLOAD_SDK }}
          key: ps5-payload-sdk-${{ runner.os }}-${{ steps.sdk.outputs.tag }}

      - name: Install PS5 Payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/sdk.zip" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${{ steps.sdk.outputs.tag }}/ps5-payload-sdk.zip"
          unzip -q "${tmp}/sdk.zip" -d "${tmp}/out"
          root="$(find "${tmp}/out" -maxdepth 2 -type d -name 'ps5-payload-sdk' | head -1 || true)"
          if [[ -z "${root}" && -x "${tmp}/out/bin/prospero-cmake" ]]; then
            root="${tmp}/out"
          fi
          [[ -n "${root}" && -x "${root}/bin/prospero-cmake" ]] || {
            echo "unexpected SDK zip layout" >&2
            exit 1
          }
          rm -rf "${PS5_PAYLOAD_SDK}"
          mkdir -p "$(dirname "${PS5_PAYLOAD_SDK}")"
          cp -a "${root}" "${PS5_PAYLOAD_SDK}"
          rm -rf "${tmp}"
          test -x "${PS5_PAYLOAD_SDK}/bin/prospero-cmake"

      - name: Build HyperHEN v0.9.2
        run: |
          set -uo pipefail
          export PATH="/usr/lib/llvm-18/bin:${PS5_PAYLOAD_SDK}/bin:${PATH}"
          if ! ./scripts/build.sh --release --jobs "$(nproc)" 2>&1 | tee hyperhen-build.log; then
            echo '### HyperHEN build failure' >> "${GITHUB_STEP_SUMMARY}"
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            tail -80 hyperhen-build.log >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(tail -60 hyperhen-build.log | base64 -w0)"
            echo "::error title=HyperHEN build tail (base64)::${diagnostic}"
            exit 1
          fi

      - name: Stage release files
        run: |
          set -euo pipefail
          test -f build/bin/HyperHEN.elf
          mkdir -p dist
          cp build/bin/HyperHEN.elf dist/HyperHEN-v0.9.2.elf
          file dist/HyperHEN-v0.9.2.elf
          (cd dist && sha256sum HyperHEN-v0.9.2.elf > SHA256SUMS)

      - name: Attach ELF to stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload HYPERHEN_V0_9_2
          dist/HyperHEN-v0.9.2.elf
          dist/SHA256SUMS
          --repo "${{ github.repository }}"
          --clobber
