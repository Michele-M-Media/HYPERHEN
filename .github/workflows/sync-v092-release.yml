name: Sync HyperHEN v0.9.2 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/releases/HYPERHEN_V0_9_2.md
      - .github/workflows/sync-v092-release.yml

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Update stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit HYPERHEN_V0_9_2
          --repo "${{ github.repository }}"
          --title "HyperHEN v0.9.2"
          --notes-file .github/releases/HYPERHEN_V0_9_2.md
